<nav
  class="fixed top-0 left-0 w-full z-50 bg-wall/90 backdrop-blur-sm border-b border-toner/10 py-3 px-5 md:px-8 flex justify-between items-center"
>
  <div
    class="text-2xl xs:text-3xl sm:text-4xl md:text-[2.6rem] font-danger-slanted tracking-tighter shrink-0 leading-none"
  >
    <a routerLink="/" aria-label="Emo Night Palermo, home">
      <span class="text-brand">EMO</span><span class="text-toner">NIGHTPALERMO</span>
    </a>
  </div>

  <div class="hidden min-[1031px]:flex gap-7 text-[0.95rem] font-semibold text-toner/80">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="text-flyer underline decoration-wavy decoration-2 underline-offset-8"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-toner transition-colors"
      >
        {{ link.label }}
      </a>
    }
  </div>

  <div class="flex items-center gap-4">
    <a
      routerLink="/contact-us"
      class="hidden min-[1031px]:inline-block paper-pink font-display text-lg uppercase px-4 py-1 -rotate-2 hover:rotate-0 transition-transform"
    >
      Contattaci
    </a>

    <button
      (click)="toggleMenu()"
      class="min-[1031px]:hidden text-toner flex flex-col gap-1.5 z-50 relative p-1"
      aria-label="Apri il menu"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span
        class="w-8 h-0.5 bg-toner transition-all"
        [class.rotate-45]="isMenuOpen()"
        [class.translate-y-2]="isMenuOpen()"
      ></span>
      <span class="w-8 h-0.5 bg-toner transition-all" [class.opacity-0]="isMenuOpen()"></span>
      <span
        class="w-8 h-0.5 bg-toner transition-all"
        [class.-rotate-45]="isMenuOpen()"
        [class.-translate-y-2]="isMenuOpen()"
      ></span>
    </button>
  </div>
</nav>

<!-- Menu mobile: i link come titoli da manifesto -->
@if (isMenuOpen()) {
  <div
    id="mobile-menu"
    class="fixed inset-0 bg-wall z-40 flex flex-col justify-center px-8 animate-in fade-in duration-200"
  >
    <nav class="flex flex-col gap-1 w-full max-h-[80vh] overflow-y-auto">
      @for (item of navLinks; track item.path) {
        <a
          [routerLink]="item.path"
          (click)="closeMenu()"
          routerLinkActive="text-flyer"
          [routerLinkActiveOptions]="{ exact: true }"
          class="font-display text-5xl uppercase leading-[1.05] text-toner hover:text-flyer transition-colors"
        >
          {{ item.label }}
        </a>
      }
      <a
        routerLink="/contact-us"
        (click)="closeMenu()"
        class="self-start mt-8 paper-pink font-display text-2xl uppercase px-5 py-2 -rotate-2"
      >
        Contattaci
      </a>
    </nav>

    <p class="absolute bottom-8 left-8 font-marker text-xerox text-base">
      it's not a phase. since 2024.
    </p>
  </div>
}
