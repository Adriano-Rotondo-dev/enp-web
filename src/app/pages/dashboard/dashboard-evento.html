<div class="max-w-4xl animate-in fade-in slide-in-from-bottom-4 duration-500">
  <header class="mb-12 border-b-4 border-white pb-4 pt-6">
    <h1
      class="text-3xl md:text-5xl font-black uppercase italic tracking-tighter leading-none"
    >
      Edit_Event
    </h1>
    <p class="text-gray-500 text-xs mt-4 uppercase font-bold tracking-widest">
      // Pannello di controllo stage
    </p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
    <div class="space-y-6">
      <h3
        class="text-purple-500 font-bold uppercase text-[10px] tracking-[0.4em] mb-4 italic"
      >
        Main_Info
      </h3>

      <div class="flex flex-col gap-2">
        <label class="enp-label"
          >Titolo Evento</label
        >
        <input
          [(ngModel)]="editableEvent().title"
          class="enp-input"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="enp-label"
            >Data</label
          >
          <input
            type="date"
            [ngModel]="editableEvent().date.slice(0, 10)"
            (ngModelChange)="editableEvent().date = $event"
            class="enp-input invert brightness-200"
          />
        </div>
        <div class="flex flex-col gap-2">
          <label class="enp-label"
            >Orario Inizio</label
          >
          <input
            type="time"
            [(ngModel)]="editableEvent().time"
            class="enp-input invert brightness-200"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label class="enp-label"
          >Location Name</label
        >
        <input
          [(ngModel)]="editableEvent().location"
          class="enp-input"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="enp-label"
          >Indirizzo</label
        >
        <input
          [(ngModel)]="editableEvent().address"
          class="enp-input"
        />
      </div>
    </div>

    <div class="space-y-6">
      <h3
        class="text-purple-500 font-bold uppercase text-[10px] tracking-[0.4em] mb-4 italic"
      >
        Live_Lineup
      </h3>

      <div class="bg-white/5 border border-white/10 p-6 space-y-4">
        @for (item of editableEvent().lineup; track $index) {
          <div class="flex gap-2 items-center">
            <input
              [(ngModel)]="item.time"
              class="w-20 text-center font-bold text-purple-500 bg-transparent border-b border-white/20 py-1 outline-none"
            />
            <input
              [(ngModel)]="item.act"
              class="flex-1 bg-transparent border-b border-white/20 py-1 outline-none text-xs uppercase"
            />
          </div>
        }
        <p class="text-[9px] uppercase text-gray-500">
          Servono orario e nome. Righe vuote = non mostrate. Tutte vuote: sul sito compare "Lineup in arrivo".
        </p>
      </div>

      <div class="flex flex-col gap-2 pt-4">
        <label class="enp-label"
          >Descrizione_Evento</label
        >
        <textarea
          [(ngModel)]="editableEvent().description"
          rows="3"
          class="enp-input"
        ></textarea>
      </div>

      <button
        (click)="saveCurrentEvent()"
        [disabled]="isSaving()"
        class="w-full bg-purple-600 text-white font-black py-4 uppercase tracking-[0.2em] shadow-[8px_8px_0px_0px_rgba(255,255,255,0.1)] hover:bg-white hover:text-black transition-all disabled:opacity-50"
      >
        {{ isSaving() ? 'UPDATING...' : 'UPDATE_STAGE_INFO' }}
      </button>
    </div>
  </div>
</div>
