<div class="dashboard-wrapper min-h-screen bg-black text-white flex font-mono">
  <aside class="hidden md:flex w-72 border-r border-white/10 flex-col p-8 bg-[#050505]">
    <div class="mb-12">
      <h2 class="text-purple-600 font-black text-2xl tracking-tighter italic leading-none pt-6">
        ENP_ADMIN
      </h2>
      <p class="text-[10px] text-gray-500 uppercase tracking-[0.3em] mt-2 italic">
        Backstage_Access
      </p>
    </div>

    <nav class="flex flex-col gap-6">
      <button
        (click)="activeTab.set('evento')"
        [class.text-purple-500]="activeTab() === 'evento'"
        class="text-left uppercase font-black text-sm text-gray-500 hover:text-white transition-all tracking-tighter"
      >
        [ 01 ] Prossimo Evento
      </button>
      <button
        (click)="activeTab.set('archivio')"
        [class.text-purple-500]="activeTab() === 'archivio'"
        class="text-left uppercase font-black text-sm text-gray-500 hover:text-white transition-all tracking-tighter"
      >
        [ 02 ] Gestione Archivio
      </button>
      <button
        (click)="activeTab.set('foto')"
        [class.text-purple-500]="activeTab() === 'foto'"
        class="text-left uppercase font-black text-sm text-gray-500 hover:text-white transition-all tracking-tighter"
      >
        [ 03 ] Archivio Foto
      </button>

      <button
        (click)="logout()"
        class="text-[10px] font-black uppercase tracking-[0.2em] transition-all bg-transparent border-none cursor-pointer py-2 px-4 border mt-auto"
        [class.text-red-500]="!isConfirmingLogout()"
        [class.border-transparent]="!isConfirmingLogout()"
        [class.text-white]="isConfirmingLogout()"
        [class.bg-red-600]="isConfirmingLogout()"
        [class.border-red-600]="isConfirmingLogout()"
        [class.animate-pulse]="isConfirmingLogout()"
      >
        {{ isConfirmingLogout() ? '[ CLICK AGAIN TO EXIT ]' : '[ Terminate Session ]' }}
      </button>
    </nav>
  </aside>

  <main class="flex-1 p-12 overflow-y-auto pb-24 md:pb-12">
    <app-dashboard-evento [class.hidden]="activeTab() !== 'evento'" />
    <app-dashboard-archivio [class.hidden]="activeTab() !== 'archivio'" />
    <app-dashboard-foto [class.hidden]="activeTab() !== 'foto'" />
  </main>

  <!-- TAB BAR MOBILE -->
  <nav
    class="md:hidden fixed bottom-0 left-0 right-0 bg-[#050505] border-t border-white/10 flex z-50"
  >
    <button
      (click)="activeTab.set('evento')"
      class="flex-1 flex flex-col items-center justify-center py-3 gap-1 transition-colors"
      [class.text-purple-500]="activeTab() === 'evento'"
      [class.text-gray-600]="activeTab() !== 'evento'"
    >
      <span class="text-[8px] font-black uppercase tracking-widest">01</span>
      <span class="text-[10px] font-black uppercase tracking-tighter">Evento</span>
    </button>

    <button
      (click)="activeTab.set('archivio')"
      class="flex-1 flex flex-col items-center justify-center py-3 gap-1 transition-colors border-x border-white/10"
      [class.text-purple-500]="activeTab() === 'archivio'"
      [class.text-gray-600]="activeTab() !== 'archivio'"
    >
      <span class="text-[8px] font-black uppercase tracking-widest">02</span>
      <span class="text-[10px] font-black uppercase tracking-tighter">Archivio</span>
    </button>

    <button
      (click)="activeTab.set('foto')"
      class="flex-1 flex flex-col items-center justify-center py-3 gap-1 transition-colors border-r border-white/10"
      [class.text-purple-500]="activeTab() === 'foto'"
      [class.text-gray-600]="activeTab() !== 'foto'"
    >
      <span class="text-[8px] font-black uppercase tracking-widest">03</span>
      <span class="text-[10px] font-black uppercase tracking-tighter">Foto</span>
    </button>

    <button
      (click)="logout()"
      class="flex-1 flex flex-col items-center justify-center py-3 gap-1 transition-colors"
      [class.text-red-500]="!isConfirmingLogout()"
      [class.text-white]="isConfirmingLogout()"
      [class.bg-red-600]="isConfirmingLogout()"
      [class.animate-pulse]="isConfirmingLogout()"
    >
      <span class="text-[8px] font-black uppercase tracking-widest">EXIT</span>
      <span class="text-[10px] font-black uppercase tracking-tighter">
        {{ isConfirmingLogout() ? 'Conferma' : 'Logout' }}
      </span>
    </button>
  </nav>
</div>
